title: Spoty
description: A calm, native Spotify music app for Linux, macOS, and Windows.
lang: en-US
timezone: Europe/Istanbul
url: https://efeio.github.io
baseurl: ""
logo: /assets/images/logo.svg
image: /assets/images/logo.svg

markdown: kramdown
kramdown:
  input: GFM

permalink: pretty
theme: jekyll-vitepress-theme

collections:
  guide:
    output: true
    permalink: "/:name/"
  reference:
    output: true
    permalink: "/:name/"

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /assets/images/logo.svg
      topics:
        - Spotify client
        - Rust
        - egui
        - librespot
        - Spotify Connect
        - Linux music player
  - scope:
      type: guide
    values:
      layout: default
  - scope:
      type: reference
    values:
      layout: default

jekyll_vitepress:
  seo:
    page_type: TechArticle
    image:
      path: /assets/images/logo.svg
      alt: Spoty, a native Spotify music app in development
    publisher:
      type: Person
      name: efeio
      url: https://github.com/efeio
      same_as:
        - https://github.com/efeio/spoty
  llms:
    title: Spoty
    description: >-
      Documentation for Spoty, a native Spotify music app for Linux, macOS,
      and Windows.
    full: true
    details: >-
      Spoty is in development. Follow the project on
      [GitHub](https://github.com/efeio/spoty).
  branding:
    site_title: Spoty
    logo:
      default: /assets/images/logo.svg
      alt: Spoty
  syntax:
    light_theme: github
    dark_theme: github.dark
  footer:
    enabled: true
    show_on_docs: false
    message: >-
      Spoty is an independent project and is not affiliated with Spotify AB.
    copyright: >-
      <span class="footer-built-with">Docs built with <a href="https://jekyll-vitepress.dev" target="_blank" rel="noreferrer">Jekyll VitePress</a>. Spotify is a trademark of Spotify AB.</span>
  doc_footer:
    enabled: true
    previous_label: Previous page
    next_label: Next page
  last_updated:
    enabled: true
    text: Last updated
    format: "%Y-%m-%d %H:%M"
  edit_link:
    enabled: true
    pattern: "https://github.com/efeio/spoty/edit/main/docs/:path"
    text: Edit this page on GitHub
  github_star:
    enabled: true
    repository: efeio/spoty
    text: Star
    show_count: true
  github_sponsor:
    enabled: false
    user: efeio
    text: Sponsor

plugins:
  - jekyll-redirect-from
  - jekyll-vitepress-theme

exclude:
  - _site
  - .jekyll-cache
  - .sass-cache
  - .bundle
  - vendor
  - Gemfile
  - Gemfile.lock
